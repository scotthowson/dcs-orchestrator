services:
  entertainment:
    container_name: skeleton-entertainment
    image: alpine:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ:-UTC}
    command: >
      sh -c 'while true; do
        echo "[$$( date )] Heartbeat — entertainment-personal stack is alive";
        sleep 60;
      done'
    healthcheck:
      test: ["CMD", "true"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
