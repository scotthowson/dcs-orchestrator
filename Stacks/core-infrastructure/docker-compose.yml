services:
  redis:
    container_name: skeleton-redis
    image: redis:8.10-alpine
    restart: unless-stopped
    # The entrypoint gives /data to the redis user and drops to it: CHOWN, SETUID and SETGID. Redis writes only /data.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp
    # The password lives in the secrets store as DCS_REDIS_PASSWORD, created on
    # first start by secrets_ensure_generated and injected only into the compose
    # process. No secret means plain redis-server — exactly today's behaviour.
    command:
      - sh
      - -c
      - 'exec redis-server $${DCS_REDIS_PASSWORD:+--requirepass "$$DCS_REDIS_PASSWORD"}'
    environment:
      - TZ=${TZ:-UTC}
      - DCS_REDIS_PASSWORD=${SECRETS_DCS_REDIS_PASSWORD:-}
    volumes:
      - ${APP_DATA_DIR:-./App-Data}/Redis:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli $${DCS_REDIS_PASSWORD:+-a "$$DCS_REDIS_PASSWORD" --no-auth-warning} ping | grep -q PONG'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dcs-ui:
    container_name: DCS-UI
    # Debian's own docker.io (26) with AppArmor 4 denies nginx its worker sockets and the dashboard never answers:
    # setup.sh sets DCS_UI_APPARMOR=unconfined in this stack's .env on such hosts; Docker CE needs nothing
    # nginx starts as root and runs its workers as nginx: SETUID and SETGID, CHOWN for its cache directories. Not read-only:
    # the entrypoint writes the API's address into /etc/nginx/conf.d/default.conf when it starts.
    security_opt:
      - "apparmor=${DCS_UI_APPARMOR:-docker-default}"
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    image: ghcr.io/scotthowson/dcs-orchestrator-ui:4.0
    # To build locally instead of pulling from GHCR, uncomment below:
    # build:
    #   context: ../../Docker-Compose-Skeleton-UI
    #   dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${DCS_UI_PORT:-3000}:3000"
    environment:
      - TZ=${TZ:-UTC}
      - DCS_API_HOST=host.docker.internal
      - DCS_API_PORT=${API_PORT:-9876}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  proxy:
    name: proxy
    driver: bridge
