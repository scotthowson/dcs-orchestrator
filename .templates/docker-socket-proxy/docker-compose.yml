services:
  docker-socket-proxy:
    container_name: Docker-Socket
    image: tecnativa/docker-socket-proxy:v0.5.0
    # No capability: it reads a socket root owns and listens on 2375. HAProxy writes its config to /tmp and its pid to /run.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - SERVICES=1
      - TASKS=1
      - EXEC=1
      - EVENTS=1
      - INFO=1
      - NETWORKS=1
      - VOLUMES=1
      - POST=0
    ports:
      - "${HOST_PORT:-2375}:2375"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2375/version"]
      interval: 30s
      timeout: 5s
      retries: 3
