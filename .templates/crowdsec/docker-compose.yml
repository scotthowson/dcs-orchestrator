services:
  crowdsec:
    container_name: CrowdSec
    image: crowdsecurity/crowdsec:v1.8.1
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - GID=${PGID:-1000}
      - COLLECTIONS=crowdsecurity/linux crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios crowdsecurity/whitelist-good-actors
    # label:disable: the host's /var/log is mounted read-only below without :z (relabelling it would change the host's own
    # SELinux labels), so on an SELinux host CrowdSec could not read it otherwise. It stays on for this container only.
    # Capabilities: CHOWN (GID= gives the database to PGID), DAC_OVERRIDE and FOWNER (App-Data/CrowdSec belongs to PUID after
    # the deploy, CrowdSec runs as root and updates the hub's files there), SETUID and SETGID (the notification plugins, Discord
    # included, run as nobody). Not read-only: the hub keeps the image's data files as links into the image and updates them in place.
    security_opt:
      - label:disable
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    volumes:
      - ${APP_DATA_DIR:-./App-Data}/CrowdSec/config:/etc/crowdsec:z
      - ${APP_DATA_DIR:-./App-Data}/CrowdSec/data:/var/lib/crowdsec/data:z
      # Traefik's access log from the same stack (JSON, written by the traefik template)
      - ${APP_DATA_DIR:-./App-Data}/Traefik/logs:/var/log/traefik:ro,z
      - /var/log:/var/log/host:ro
    ports:
      # LAPI stays on loopback: the Traefik bouncer talks to it over the stack network
      - "127.0.0.1:${PORT_CROWDSEC:-8070}:8080"
    healthcheck:
      test: ["CMD", "cscli", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
