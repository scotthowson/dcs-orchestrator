# Traefik middleware for the CrowdSec bouncer plugin, written by DCS when the
# crowdsec template is deployed with the bouncer enabled. The key is a CrowdSec
# bouncer credential registered on the LAPI (cscli bouncers list).
http:
  middlewares:
    crowdsec-bouncer:
      plugin:
        crowdsec-bouncer-traefik-plugin:
          enabled: "true"
          logLevel: INFO
          updateIntervalSeconds: 60
          defaultDecisionSeconds: 10
          httpTimeoutSeconds: 10
          crowdsecMode: live
          crowdsecAppsecEnabled: "false"
          crowdsecLapiKey: __LAPI_KEY__
          crowdsecLapiHost: "CrowdSec:8080"
          crowdsecLapiScheme: http
          forwardedHeadersTrustedIPs:
            - 173.245.48.0/20
            - 103.21.244.0/22
            - 103.22.200.0/22
            - 103.31.4.0/22
            - 141.101.64.0/18
            - 108.162.192.0/18
            - 190.93.240.0/20
            - 188.114.96.0/20
            - 197.234.240.0/22
            - 198.41.128.0/17
            - 162.158.0.0/15
            - 104.16.0.0/13
            - 104.24.0.0/14
            - 172.64.0.0/13
            - 131.0.72.0/22
            - 2400:cb00::/32
            - 2606:4700::/32
            - 2803:f800::/32
            - 2405:b500::/32
            - 2405:8100::/32
            - 2a06:98c0::/29
            - 2c0f:f248::/32
            - __TRUSTED_LAN__
          clientTrustedIPs:
            - __TRUSTED_LAN__
