services:
  sablier:
    image: acouvreur/sablier:1.6.1
    container_name: Sablier
    restart: unless-stopped
    # Sablier talks to the Docker socket and writes only its state file in App-Data/Sablier/data, which belongs to PUID
    # after the deploy: DAC_OVERRIDE lets it (root) write there, nothing else is needed. The image is read-only.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    read_only: true
    # Every setting is a flag: the idle time and the waiting page of a container come from
    # the Traefik middleware on its route (the Containers page writes it), these are defaults.
    # The state file lives in a directory, which Sablier creates it in on the first start.
    command:
      - start
      - --provider.name=docker
      - --storage.file=/etc/sablier/data/state.json
      - --sessions.default-duration=30m
      - --strategy.dynamic.default-theme=ghost
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APP_DATA_DIR:-./App-Data}/Sablier/data:/etc/sablier/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:10000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
