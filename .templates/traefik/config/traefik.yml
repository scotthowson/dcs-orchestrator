# =============================================================================
# Traefik Static Configuration
# =============================================================================
# Main Traefik configuration — deployed by DCS Orchestrator.
# Template variables (${TRAEFIK_DOMAIN:-example.com}, etc.) are substituted at deploy time.
# Documentation: https://doc.traefik.io/traefik/
# =============================================================================

global:
  checkNewVersion: true
  sendAnonymousUsage: false

serversTransport:
  insecureSkipVerify: true

# -----------------------------------------------------------------------------
# Entry Points
# -----------------------------------------------------------------------------
entryPoints:
  web:
    address: ':80'
    forwardedHeaders:
      trustedIPs: &trustedIps
        # Cloudflare IPv4
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        # Cloudflare IPv6
        - '2400:cb00::/32'
        - '2606:4700::/32'
        - '2803:f800::/32'
        - '2405:b500::/32'
        - '2405:8100::/32'
        - '2a06:98c0::/29'
        - '2c0f:f248::/32'
        # Local network
        - ${TRAEFIK_TRUSTED_LAN:-192.168.1.0/24}
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ':443'
    forwardedHeaders:
      trustedIPs: *trustedIps
    # Traefik v3 stops reading a request after 60 s by default, body included: a large upload from the browser (a backup
    # archive on the dashboard, up to 20 GB) takes longer than that. Idle connections still close after 180 s.
    transport:
      respondingTimeouts:
        readTimeout: 6h
    http:
      tls:
        certResolver: letsencrypt
        domains:
          - main: ${TRAEFIK_DOMAIN:-example.com}
            sans:
              - '*.${TRAEFIK_DOMAIN:-example.com}'

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
# Traefik downloads every plugin declared here when it starts, and does not start
# at all when one cannot be fetched — so a plugin is declared only while its add-on
# is on. DCS keeps each block between "# dcs-if: SWITCH" and "# dcs-end" in step
# with the deploy's switches (the Traefik step of the setup wizard, the deploy
# sheet, TRAEFIK_* in the stack's .env); the middlewares that use them are written
# by DCS into custom_routes/. The CrowdSec bouncer is declared always: the crowdsec
# template wires it. Versions are pinned to a known-good set.
experimental:
  plugins:
    crowdsec-bouncer-traefik-plugin:
      moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      version: "v1.4.4"
    # dcs-if: TRAEFIK_SABLIER
    # sablier:
    #   moduleName: "github.com/acouvreur/sablier"
    #   version: "v1.7.0-beta.15"
    # dcs-end
    # dcs-if: TRAEFIK_CLOUDFLARE_REAL_IP
    # cloudflarewarp:
    #   moduleName: "github.com/BetterCorp/cloudflarewarp"
    #   version: "v1.3.3"
    # dcs-end
    # dcs-if: TRAEFIK_GEOBLOCK
    # geoblock:
    #   moduleName: "github.com/PascalMinder/geoblock"
    #   version: "v0.3.8"
    # dcs-end
    # dcs-if: TRAEFIK_THEMEPARK
    # themepark:
    #   moduleName: "github.com/packruler/traefik-themepark"
    #   version: "v1.4.2"
    # dcs-end
    # dcs-if: TRAEFIK_MAINTENANCE
    # maintenance:
    #   moduleName: "github.com/TRIMM/traefik-maintenance"
    #   version: "v1.0.1"
    # dcs-end

providers:
  providersThrottleDuration: 2s

  # File provider — reads route configs from custom_routes/ directory
  # Each stack category has its own subdirectory matching DOCKER_STACKS
  file:
    directory: /etc/traefik/custom_routes
    watch: true

  # Docker provider — auto-discovers containers via Docker Socket Proxy
  docker:
    watch: true
    network: proxy
    defaultRule: 'Host(`{{ lower (trimPrefix `/` .Name )}}.${TRAEFIK_DOMAIN:-example.com}`)'
    exposedByDefault: false
    endpoint: 'tcp://Docker-Socket:2375'

# -----------------------------------------------------------------------------
# Dashboard
# -----------------------------------------------------------------------------
api:
  dashboard: true
  insecure: true

ping:
  entryPoint: "traefik"

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
log:
  level: INFO

# JSON access log on disk: CrowdSec reads it (mounted read-only into its container)
accessLog:
  filePath: /var/log/traefik/access.log
  format: json
  bufferingSize: 100

# -----------------------------------------------------------------------------
# Certificate Resolvers
# -----------------------------------------------------------------------------
certificatesResolvers:
  letsencrypt:
    acme:
      email: ${TRAEFIK_ACME_EMAIL:-admin@example.com}
      storage: /etc/traefik/acme.json
      # DCS keeps one of the two challenges below when the template is deployed:
      # a Cloudflare token (CF_DNS_API_TOKEN) selects the DNS challenge (wildcards,
      # no open port 80 needed), an empty token the HTTP challenge on port 80.
      # dcs-challenge: dns
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - '1.1.1.1:53'
          - '1.0.0.1:53'
      # dcs-challenge: http
      # httpChallenge:
      #   entryPoint: web
      # dcs-challenge: end
