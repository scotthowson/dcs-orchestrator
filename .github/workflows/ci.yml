name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

# bash with pipefail for every step: a suite piped into tee must fail the step when the suite fails
# (the default shell has no pipefail, and "tests/smoke.sh | tee" then always passes)
defaults:
  run:
    shell: bash

jobs:
  lint-and-test:
    # both Ubuntu images: 24.04 is what "latest" was, 26.04 is what it becomes on October 19, 2026
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        # ShellCheck 0.10+ has --extended-analysis (the linter turns it off for the 27,000-line API script:
        # the dataflow analysis needs ~12 GB and killed the 7 GB runner); Ubuntu's package is 0.9
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq socat xz-utils
          sudo apt-get install -y -qq ncat || echo "ncat is not available: the ncat restart test is skipped"
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz | tar -xJ
          sudo install -m 755 shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck && rm -rf shellcheck-v0.10.0
          shellcheck --version | head -2

      - name: Lint (bash -n, shellcheck, compose config, API reference)
        run: tests/lint.sh

      - name: Smoke tests (request handler over stdin)
        run: tests/smoke.sh 2>&1 | tee smoke.log

      # the checks that failed, on the run's summary page (the logs need a sign-in)
      - name: Smoke failures in the summary
        if: failure()
        run: |
          {
            echo '### Smoke checks that failed (${{ matrix.os }})'
            echo
            echo '```'
            grep -E '^  FAIL' smoke.log || echo '(no FAIL line — the run stopped before the end; last lines below)'
            tail -n 15 smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: API worker pool (a real listener on loopback)
        run: tests/api-workers.sh

      - name: A VM stack's files are the hub's (a hub and a member, two real listeners)
        run: tests/fleet-files.sh

      - name: Restore from scratch (backup and recovery bundle, wiped, restored, compared file by file)
        run: tests/restore-drill.sh

      - name: VM images — the first-boot script against the seeds Proxmox writes
        run: vm-images/tests/dcs-init-test.sh

      - name: VM images — the boot menu writer against every distribution's kernel names
        run: vm-images/tests/dcs-grubcfg-test.sh

      - name: Documentation — every link, image and anchor resolves; the template catalogue is current
        run: |
          python3 docs/tools/check-links.py
          bash docs/tools/gen-templates.sh --check

      - name: Setup dry run
        run: ./setup.sh --dry-run

  smoke-debian:
    # The hub VM images and most home servers run Debian 13, whose jq (Debian's build of 1.7.1, reporting jq-1.7) parses
    # stricter than Ubuntu's: an operator inside an object value, `f?.x` and `A + B as $x` are errors there and only there.
    # 4.0.4's CrowdSec page and VM details failed on every Debian 13 hub while CI on Ubuntu stayed green.
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 45
    steps:
      - name: Install tools
        run: |
          # what a Debian 13 server that runs DCS has: the Docker CLI with Compose (the job container gets the runner's Docker socket) and the
          # tools the API calls; without them the API stops at start-up and a third of the checks fail
          apt-get update -qq && apt-get install -y -qq jq socat curl git python3 ca-certificates procps ncat iproute2 docker-cli docker-compose openssh-client rsync xz-utils zstd xxd file wget sudo unzip zip bc bsdextrautils
          docker compose version
          jq --version
      - uses: actions/checkout@v7
      - name: Let git read the checkout
        # the job container runs as root and the checkout belongs to the runner's user: git refuses such a repository
        # ("dubious ownership"), and the stand-in VM build clones this very checkout
        run: git config --global --add safe.directory '*'

      - name: Smoke tests on Debian 13's jq (request handler over stdin)
        run: tests/smoke.sh 2>&1 | tee smoke-debian.log

      - name: API worker pool and a VM stack's files on Debian 13's jq
        run: tests/api-workers.sh && tests/fleet-files.sh

      # as root here: the drill checks the owners of every file too (a database's, root's), not only content and modes
      - name: Restore from scratch on Debian 13, owners checked (backup and recovery bundle, wiped, restored, compared file by file)
        run: tests/restore-drill.sh

      - name: Smoke failures in the summary
        if: failure()
        run: |
          {
            echo '### Smoke checks that failed (debian:trixie)'
            echo
            echo '```'
            grep -E '^  FAIL' smoke-debian.log || echo '(no FAIL line — the run stopped before the end; last lines below)'
            tail -n 15 smoke-debian.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  upgrade-path:
    # "Easy to update", proven on every change: the previous release (the newest vX.Y.Z tag before this commit) is cloned,
    # started as a real listener and used through its API (accounts, a session, an API key, .env settings, rules, a backup
    # destination and schedule, a secret, a theme, CrowdSec and fleet state, edited stack and template files); then ITS OWN
    # updater brings it to this commit from a local origin (nothing reaches GitHub) and restarts in place. Every token, key,
    # setting and state file must come through with its content and mode, and a second update must be a no-op.
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 20
    steps:
      - name: Install tools
        # git before the checkout: without it actions/checkout downloads a tarball, which has no tags
        run: |
          apt-get update -qq && apt-get install -y -qq jq socat curl git python3 ca-certificates procps ncat iproute2 docker-cli docker-compose openssh-client rsync xz-utils zstd xxd file wget sudo unzip zip bc bsdextrautils
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the whole history with its release tags: the test starts from the previous release
      - name: Let git read the checkout
        run: git config --global --add safe.directory '*'

      - name: Upgrade path (previous release -> this commit, by the release's own updater)
        run: tests/upgrade-path.sh 2>&1 | tee upgrade-path.log

      - name: Upgrade path failures in the summary
        if: failure()
        run: |
          {
            echo '### Upgrade-path checks that failed'
            echo
            echo '```'
            grep -E '^(  )?FAIL' upgrade-path.log || echo '(no FAIL line — the run stopped before the end; last lines below)'
            tail -n 15 upgrade-path.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
